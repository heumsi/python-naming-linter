repos:
  - repo: local
    hooks:
      - id: ruff check
        name: ruff check (lint)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff format
        name: ruff format (format)
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ty check
        name: ty check (type check)
        entry: uv run ty check
        language: system
        pass_filenames: false
        types: [python]
      - id: naming-linter
        name: naming linter (self)
        entry: uv run pnl check
        language: system
        pass_filenames: false
        always_run: true
